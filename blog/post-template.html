<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- UPDATE: Change the title for each post -->
    <title>Your Post Title | dariangarcia.com</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav">
            <a href="../index.html" class="logo">dariangarcia.com</a>
            <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../about.html">About</a></li>
                <li><a href="../blog.html">D.Log</a></li>
            </ul>
        </nav>
    </header>

    <!-- Blog Post -->
    <section class="blog-post-page">
        <div class="blog-post-terminal terminal-window">
            <div class="terminal-header">
                <div class="terminal-controls">
                    <div class="terminal-button close"></div>
                    <div class="terminal-button minimize"></div>
                    <div class="terminal-button maximize"></div>
                </div>
                <!-- UPDATE: Change the filename in the terminal title -->
                <div class="terminal-title">your-post-slug.md</div>
            </div>
            <div class="blog-post-content">
                <a href="../blog.html" class="blog-post-back">Back to D.Log</a>

                <!-- UPDATE: Post date and reading time -->
                <div class="blog-post-meta">
                    <span class="blog-post-date">YYYY-MM-DD</span>
                    <span class="blog-post-reading-time">X min read</span>
                </div>

                <!-- UPDATE: Post title -->
                <h1>Your Blog Post Title Here</h1>

                <!-- UPDATE: Post tags -->
                <div class="blog-post-tags">
                    <span class="skill-tag">tag1</span>
                    <span class="skill-tag">tag2</span>
                    <span class="skill-tag">tag3</span>
                </div>

                <!--
                ===================================================
                BLOG POST CONTENT — WRITE IN MARKDOWN!
                ===================================================
                Edit the content inside the <script> tag below.
                Write standard Markdown — it will be rendered to
                HTML automatically by marked.js.

                Supports: headings, bold, italic, links, images,
                lists, code blocks, blockquotes, tables, and more.

                Tips:
                - Use ``` for fenced code blocks
                - Use > for blockquotes
                - Use **bold** and *italic*
                - Use [text](url) for links
                - Use ![alt](url) for images
                ===================================================
                -->
                <div id="post-body" class="blog-post-body"></div>
                <script id="post-markdown" type="text/markdown">
Your opening paragraph goes here. This sets the context for the post and hooks the reader.

## Section Heading

Section content goes here. Use regular paragraphs for body text. You can use **bold** and *italic* text naturally.

### Sub-Section Heading

You can use `inline code` for technical terms, commands, or file names.

Use lists for structured content:

- Unordered list item one
- Unordered list item two
- Unordered list item three

1. Ordered list item one
2. Ordered list item two
3. Ordered list item three

Use fenced code blocks for command examples or code snippets:

```bash
echo "your code or command here"
```

> Use blockquotes for callouts, key takeaways, or notable quotes.

Use [links](https://example.com) for references to external resources.

| Column 1 | Column 2 | Column 3 |
|-----------|----------|----------|
| Row 1     | Data     | Data     |
| Row 2     | Data     | Data     |
                </script>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 Darian Garcia — IT Systems Engineer. All rights reserved.</p>
        </div>
    </footer>

    <script src="../assets/js/main.js"></script>
    <!-- marked.js — lightweight Markdown parser (7KB gzipped, no dependencies) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Render the Markdown content into the post body
        (function() {
            const md = document.getElementById('post-markdown');
            const body = document.getElementById('post-body');
            if (md && body) {
                // Get raw markdown, trim leading/trailing whitespace
                const raw = md.textContent.trim();
                // Configure marked for GFM (tables, strikethrough, etc.)
                marked.setOptions({
                    gfm: true,
                    breaks: false
                });
                body.innerHTML = marked.parse(raw);
            }
        })();
    </script>
</body>
</html>
